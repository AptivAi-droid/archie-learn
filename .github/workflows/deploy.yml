name: Deploy to GitHub Pages

# One Pages site, two builds:
#   master -> https://aptivai-droid.github.io/archie-learn/      (production)
#   dev    -> https://aptivai-droid.github.io/archie-learn/dev/  (student pilot / testing)
# A push to either branch rebuilds BOTH so neither wipes the other.

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          path: prod
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: devsrc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The web app lives in frontend/ since the CI4 backend split; master may still have
      # the old root layout until dev is merged, so build whichever exists.
      - name: Build production (master)
        env:
          # Legacy Supabase build on master (retired once dev is merged)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL_PROD }}
        run: |
          cd prod; [ -d frontend ] && cd frontend
          npm ci && npm run build && echo "PROD_DIST=$PWD/dist" >> "$GITHUB_ENV"
      - name: Build dev
        env:
          VITE_BASE_PATH: /archie-learn/dev/
          # CodeIgniter API for the pilot (repo variable, set once cPanel hosting exists)
          VITE_API_URL: ${{ vars.VITE_API_URL_DEV }}
        run: |
          cd devsrc; [ -d frontend ] && cd frontend
          npm ci && npm run build && echo "DEV_DIST=$PWD/dist" >> "$GITHUB_ENV"
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r "$PROD_DIST/." site/
          mkdir -p site/dev
          cp -r "$DEV_DIST/." site/dev/
          rm -f site/dev/404.html
          # Keep prod's own 404.html (SPA fallback) and prepend the dev handoff to it.
          node -e "const fs=require('fs');const f='site/404.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('<head>','<head>'+fs.readFileSync('devsrc/.github/pages-dev-handoff.html','utf8')))"
          grep -q "archie-learn/dev/" site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
